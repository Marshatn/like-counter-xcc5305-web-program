<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Like & Share Button</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
      padding: 5px;
      margin: 0;
      background: transparent;
    }

    .widget-container {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    /* Like Button Styling */
    .like-btn {
      background: #ffffff;
      border: 1px solid #dcdcdc;
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 14px;
      font-weight: bold;
      color: #333333;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      user-select: none;
      transition: background 0.2s, transform 0.1s;
    }

    .like-btn:active {
      transform: scale(0.95);
      background: #f8f8f8;
    }

    .heart-icon {
      color: #e74c3c;
      font-size: 16px;
    }

    /* Share Buttons Styling */
    .share-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .share-fb {
      background-color: #1877F2;
    }

    .share-wa {
      background-color: #25D366;
    }

    .share-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="widget-container">
    <!-- Heart Like Button -->
    <button class="like-btn" id="likeButton" onclick="addLike()">
      <span class="heart-icon">♥</span>
      <span>Like</span>
      <span id="likeCount">...</span>
    </button>

    <!-- Facebook Share Button -->
    <a id="fbShare" class="share-btn share-fb" target="_blank" rel="noopener">
      Facebook
    </a>

    <!-- WhatsApp Share Button -->
    <a id="waShare" class="share-btn share-wa" target="_blank" rel="noopener">
      WhatsApp
    </a>
  </div>

  <!-- Firebase Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // 1. Read query parameters from the iframe link
    const urlParams = new URLSearchParams(window.location.search);

    // Fallback values if none are provided in the URL
    const defaultUrl = "https://sites.google.com/moe-dl.edu.my/chkb-xcc5305/%E5%AD%A6%E6%A0%A1%E4%B8%8E%E7%A4%BE%E5%8C%BA-sekolah-komuniti/%E6%B4%BB%E5%8A%A8-program-komuniti?authuser=0";

    // Unique ID for Firebase (Defaults to item_1 for backward compatibility)
    const itemId = urlParams.get('id') || 'item_1';

    // Share URL for Facebook and WhatsApp
    const targetShareUrl = urlParams.get('url') || defaultUrl;

    // 2. Set share links dynamically
    document.getElementById('fbShare').href = "https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(targetShareUrl);
    document.getElementById('waShare').href = "https://api.whatsapp.com/send?text=" + encodeURIComponent(targetShareUrl);

    // 3. Initialize Firebase Realtime Database
    const firebaseConfig = {
      projectId: "xcc5305-like-program",
      databaseURL: "https://xcc5305-like-program-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Point to 'likes/itemId' inside your Firebase database
    const likeRef = db.ref('likes/' + itemId);

    // 4. Sync count (Starts at 1 if brand new)
    likeRef.on('value', (snapshot) => {
      const currentVal = snapshot.val();
      document.getElementById('likeCount').textContent = (currentVal === null) ? 1 : currentVal;
    });

    // 5. Add like on click
    function addLike() {
      likeRef.transaction((count) => {
        if (count === null) {
          return 2; // Starts at 1, so 1st click becomes 2
        }
        return count + 1;
      });
    }
  </script>

</body>
</html>
