<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Like Button</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f9f9f9;
    }
    .like-btn {
      background-color: #ffffff;
      border: 2px solid #e0e0e0;
      border-radius: 20px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .like-btn:hover {
      background-color: #f0f0f0;
    }
    .heart {
      color: #e0e0e0;
      transition: color 0.2s ease;
    }
    .like-btn.liked .heart {
      color: #e74c3c;
    }
    .count {
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>

  <button class="like-btn" id="likeButton" onclick="toggleLike()">
    <span class="heart">♥</span>
    <span id="likeText">Like</span>
    <span class="count" id="likeCount">0</span>
  </button>

  <script>
    // Load existing count from LocalStorage or start at 0
    let count = parseInt(localStorage.getItem('like_count')) || 0;
    let isLiked = localStorage.getItem('is_liked') === 'true';

    const btn = document.getElementById('likeButton');
    const countDisplay = document.getElementById('likeCount');

    function updateDisplay() {
      countDisplay.textContent = count;
      if (isLiked) {
        btn.classList.add('liked');
      } else {
        btn.classList.remove('liked');
      }
    }

    function toggleLike() {
      if (isLiked) {
        count--;
        isLiked = false;
      } else {
        count++;
        isLiked = true;
      }
      localStorage.setItem('like_count', count);
      localStorage.setItem('is_liked', isLiked);
      updateDisplay();
    }

    // Initialize button state on page load
    updateDisplay();
  </script>

</body>
</html>
