<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Like & Share Button</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
      padding: 5px;
      margin: 0;
      background: transparent;
    }

    .widget-container {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    /* Like Button Styling */
    .like-btn {
      background: #ffffff;
      border: 1px solid #dcdcdc;
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 14px;
      font-weight: bold;
      color: #333333;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      user-select: none;
      transition: background 0.2s, transform 0.1s;
    }

    .like-btn:active {
      transform: scale(0.95);
      background: #f8f8f8;
    }

    .like-btn.liked {
      cursor: default;
      opacity: 0.85;
    }

    /* Wrapper to isolate heart movement */
    .heart-wrapper {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
    }

    /* Continuous Bumping & Color Shifting (Neon Red -> Hot Pink -> Magenta, NO BLACK) */
    @keyframes bumpAndGlow {
      0%, 100% { 
        transform: scale(1); 
        fill: #ff1a40; 
        filter: drop-shadow(0 0 5px #ff1a40); 
      }
      33% { 
        transform: scale(1.25); 
        fill: #ff2a85; 
        filter: drop-shadow(0 0 9px #ff2a85); 
      }
      66% { 
        transform: scale(1.1); 
        fill: #ff00ff; 
        filter: drop-shadow(0 0 14px #ff66cc); 
      }
    }

    .heart-icon {
      width: 26px;
      height: 26px;
      animation: bumpAndGlow 1.4s infinite ease-in-out;
      transform-origin: center;
    }

    /* Click Effect: Bumping and Color Flash (Neon Red to Magenta strictly) */
    @keyframes clickBump {
      0% { 
        transform: scale(1); 
        fill: #ff1a40; 
        filter: drop-shadow(0 0 6px #ff1a40);
      }
      30% { 
        transform: scale(1.6); 
        fill: #ff00ff; 
        filter: drop-shadow(0 0 20px #ff66cc);
      }
      60% { 
        transform: scale(0.95); 
        fill: #ff3399; 
        filter: drop-shadow(0 0 10px #ff3399);
      }
      100% { 
        transform: scale(1); 
        fill: #ff1a40; 
        filter: drop-shadow(0 0 5px #ff1a40);
      }
    }

    .heart-click-bump {
      animation: clickBump 0.4s ease !important;
    }

    /* Share Buttons Styling */
    .share-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .share-fb {
      background-color: #1877F2;
    }

    .share-wa {
      background-color: #25D366;
    }

    .share-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="widget-container">
    <!-- Heart Like Button -->
    <button class="like-btn" id="likeButton" onclick="addLike()">
      <span class="heart-wrapper">
        <!-- fill="#ff1a40" guarantees it never defaults to black -->
        <svg id="heartIcon" class="heart-icon" viewBox="0 0 24 24" fill="#ff1a40">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </span>
      <span id="btnText">Like</span>
      <span id="likeCount">...</span>
    </button>

    <!-- Facebook Share Button -->
    <a id="fbShare" class="share-btn share-fb" target="_blank" rel="noopener">
      Facebook
    </a>

    <!-- WhatsApp Share Button -->
    <a id="waShare" class="share-btn share-wa" target="_blank" rel="noopener">
      WhatsApp
    </a>
  </div>

  <!-- Firebase Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // 1. Read query parameters from the iframe link
    const urlParams = new URLSearchParams(window.location.search);

    const defaultUrl = "https://sites.google.com/moe-dl.edu.my/chkb-xcc5305/%E5%AD%A6%E6%A0%A1%E4%B8%8E%E7%A4%BE%E5%8C%BA-%E7%A4%BE%E5%8C%BA/%E6%B4%BB%E5%8A%A8-program-komuniti?authuser=0";
    const itemId = urlParams.get('id') || 'item_1';
    const targetShareUrl = urlParams.get('url') || defaultUrl;

    document.getElementById('fbShare').href = "https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(targetShareUrl);
    document.getElementById('waShare').href = "https://api.whatsapp.com/send?text=" + encodeURIComponent(targetShareUrl);

    // 2. Initialize Firebase Realtime Database
    const firebaseConfig = {
      projectId: "xcc5305-like-program",
      databaseURL: "https://xcc5305-like-program-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const likeRef = db.ref('likes/' + itemId);

    likeRef.on('value', (snapshot) => {
      const currentVal = snapshot.val();
      document.getElementById('likeCount').textContent = (currentVal === null) ? 1 : currentVal;
    });

    // 3. Session restriction (only 1 click per session; refreshing allows clicking again)
    const sessionKey = 'liked_' + itemId;
    if (sessionStorage.getItem(sessionKey) === 'true') {
      document.getElementById('likeButton').classList.add('liked');
      document.getElementById('btnText').textContent = 'Liked';
    }

    // Audio setup using your uploaded sound file source
    const clickSound = new Audio("https://cdn.freesound.org/previews/612/612749_5121236-lq.mp3");
    clickSound.volume = 1.0;

    // 4. Add like on click
    function addLike() {
      if (sessionStorage.getItem(sessionKey) === 'true') {
        return; // Already liked in this session
      }

      sessionStorage.setItem(sessionKey, 'true');
      document.getElementById('likeButton').classList.add('liked');
      document.getElementById('btnText').textContent = 'Liked';

      // Play sound
      clickSound.currentTime = 0;
      clickSound.play().catch(err => {
        console.log("Audio playback restricted by browser policy:", err);
      });

      // Trigger heart animation bump
      const heart = document.getElementById('heartIcon');
      heart.classList.remove('heart-icon', 'heart-click-bump');
      void heart.offsetWidth; 
      heart.classList.add('heart-click-bump');
      
      setTimeout(() => {
        heart.classList.add('heart-icon');
      }, 400);

      // Increment Firebase count safely
      likeRef.transaction((count) => {
        if (count === null) {
          return 2; 
        }
        return count + 1;
      });
    }
  </script>

</body>
</html>
